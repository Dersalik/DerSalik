# Generates the GitHub stats cards for the profile README in the portfolio's colors,
# as light and dark SVGs committed to profile/. Runs daily and on demand.
name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&size_weight=0.5&count_weight=0.5&bg_color=FFFFFF&title_color=0E1726&text_color=3E4A5C&border_color=DDE1E7&border_radius=12
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&size_weight=0.5&count_weight=0.5&bg_color=0E1726&title_color=E8EDF5&text_color=B4BFCF&border_color=26324A&border_radius=12
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&disable_animations=true&border_radius=12&background=FFFFFF&border=DDE1E7&stroke=DDE1E7&ring=1F4FD8&fire=1F4FD8&currStreakNum=0E1726&sideNums=0E1726&currStreakLabel=1F4FD8&sideLabels=3E4A5C&dates=5A6578
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&disable_animations=true&border_radius=12&background=0E1726&border=26324A&stroke=26324A&ring=8EADFF&fire=8EADFF&currStreakNum=E8EDF5&sideNums=E8EDF5&currStreakLabel=8EADFF&sideLabels=B4BFCF&dates=94A0B4
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
