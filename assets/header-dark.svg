  <text x="56" y="178" class="sans" font-size="54" font-weight="600" fill="#FFFFFF" letter-spacing="-1.2">Mohammed Sardar Farooq</text>
  <text x="56" y="224" class="body" font-size="26" font-weight="500" fill="#DCE3EE">Senior Software Engineer</text>
